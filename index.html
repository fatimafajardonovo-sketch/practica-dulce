<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SugarByte</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="inicio">
    <a class="brand" href="#inicio" aria-label="SugarByte, inicio">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>Sugar<span class="brand-accent">Byte</span></span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a href="#inicio">Inicio</a>
      <a href="#gomitas">Gomitas</a>
      <a href="#chocolates">Chocolates</a>
      <a href="#packs-regalo">Packs Regalo</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <p class="hero-eyebrow">Un mundo de pequeños caprichos</p>
        <h1 id="hero-title">Tu dosis diaria <span>de azúcar</span></h1>
        <p class="hero-description">
          Gomitas, chocolates y tus antojos favoritos, reunidos en una caja
          hecha a tu manera.
        </p>
        <a class="hero-cta" href="#gomitas">
          Armar mi caja de dulces
          <span aria-hidden="true">→</span>
        </a>
        <p class="hero-note">Elige tus favoritos. Nosotros ponemos la magia.</p>
      </div>

      <div class="hero-art" aria-hidden="true">
        <span class="hero-sparkle sparkle-one">✦</span>
        <span class="hero-sparkle sparkle-two">✦</span>
        <div class="candy-orbit orbit-one"></div>
        <div class="candy-orbit orbit-two"></div>
        <div class="candy-piece candy-gummy">🍬</div>
        <div class="candy-piece candy-lollipop">🍭</div>
        <div class="candy-piece candy-chocolate">🍫</div>
        <div class="hero-sticker">100%<br>antojo</div>
      </div>
    </section>
  </main>
</body>
</html>
